name: SkynetARK - Publish v10.5.1 v2 channel
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/skynetark-v1051-public-v2.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Publish exact signed v10.5.1 bundle
        shell: bash
        run: |
          set -euo pipefail
          URL='https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-974c-820e-aba5-dc8312b4d4cc/raw?se=2026-10-04T17%3A39%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=af0024ec-a36f-541a-a172-bbb258f36885&skoid=127c13cb-e695-43ea-b6b2-0a863d41dbf7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T18%3A56%3A52Z&ske=2026-10-04T18%3A56%3A52Z&sks=b&skv=2026-02-06&sig=acIvyDegaoooEqVINJiuBQT/t9JZS5XJNk%2B827MVshs%3D'
          ART=/tmp/v1051-artifact.zip
          BUNDLE=/tmp/SkynetARK_v10.5.1_LocalUpdateBundle_LaerteGyn.zip
          curl --fail-with-body --silent --show-error --location "$URL" --output "$ART"
          test "$(sha256sum "$ART" | awk '{print toupper($1)}')" = "1377E802B765B5E309408CE6F8810F48A261F6DEE98EB0E0B67A8D4682A3A5B4"
          unzip -tq "$ART" >/dev/null
          unzip -p "$ART" SkynetARK_v10.5.1_LocalUpdateBundle_LaerteGyn.zip > "$BUNDLE"
          test "$(sha256sum "$BUNDLE" | awk '{print toupper($1)}')" = "AB7E77E362D1822825D20677DEFD35FE9EA415362F51FFE3404717C528BA426E"
          python - <<'PY'
          import zipfile,json,hashlib,io
          raw=open('/tmp/SkynetARK_v10.5.1_LocalUpdateBundle_LaerteGyn.zip','rb').read()
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None
              m=json.loads(z.read('manifest.json'))
              payload=z.read('payload.zip')
          assert m['product']=='SkynetARK'
          assert m['version']=='10.5.1'
          assert hashlib.sha256(payload).hexdigest().upper()=='13E5E3DD591C1006F7D249C47C4D92DC0BAC4DE3CF5B68A7409161BA46FB21E2'
          assert hashlib.sha256(payload).hexdigest().lower()==m['sha256'].lower()
          with zipfile.ZipFile(io.BytesIO(payload)) as pz:
              assert pz.read('SkynetARK/VERSION').decode('utf-8-sig').strip()=='10.5.1'
              assert hashlib.sha256(pz.read('SkynetARK/tools/SkynetARK_Update.exe')).hexdigest().upper()=='DC22C3A687A407AB9E906963F54D2DBEDC211BE2C1496629E87349BD2F05C8B7'
              assert b'processes.top_memory' in pz.read('SkynetARK/core/v1051_windows_tools.py')
              assert b'UNKNOWN_PARAMETER' in pz.read('SkynetARK/core/v1051_windows_tools.py')
              assert b'/api/v10.5/windows/repair' in pz.read('SkynetARK/core/v1051_local_ai.py')
          print('V1051_PUBLIC_SOURCE_VERIFIED=OK')
          PY
          OUT='skynetark-updates/update/v2/stable/v10.5.1'
          rm -rf "$OUT"
          mkdir -p "$OUT"
          python - <<'PY'
          import base64,pathlib,json
          b=pathlib.Path('/tmp/SkynetARK_v10.5.1_LocalUpdateBundle_LaerteGyn.zip').read_bytes()
          out=pathlib.Path('skynetark-updates/update/v2/stable/v10.5.1')
          size=500000
          parts=[]
          for i in range(0,len(b),size):
              p=out/f'part-{i//size:03d}.b64'
              p.write_text(base64.b64encode(b[i:i+size]).decode('ascii'),encoding='ascii')
              parts.append(f'https://raw.githubusercontent.com/laertegynuk/termos-de-servi-o/main/{p.as_posix()}')
          manifest={
            'product':'SkynetARK',
            'channel':'stable',
            'latest_version':'10.5.1',
            'bundle_sha256':'ab7e77e362d1822825d20677defd35fe9ea415362f51ffe3404717c528ba426e',
            'bundle_parts':parts,
            'release_url':'https://github.com/laertegynuk/Projetos-Pessoais/releases/tag/skynetark-v10.5.1',
            'notes':'SkynetARK v10.5.1 - catalogo confiavel de diagnosticos Windows, validacao PowerShell antes da confirmacao, revalidacao no Agent e reparo com nova confirmacao obrigatoria.',
            'published_at':'2026-10-04T17:34:22Z'
          }
          mf=pathlib.Path('skynetark-updates/update/v2/manifest.json')
          mf.parent.mkdir(parents=True,exist_ok=True)
          mf.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (out/'SHA256SUMS.txt').write_text(
              'VERSION=10.5.1\n'
              'PAYLOAD_SHA256=13E5E3DD591C1006F7D249C47C4D92DC0BAC4DE3CF5B68A7409161BA46FB21E2\n'
              'BUNDLE_SHA256=AB7E77E362D1822825D20677DEFD35FE9EA415362F51FFE3404717C528BA426E\n'
              'UPDATER_SHA256=DC22C3A687A407AB9E906963F54D2DBEDC211BE2C1496629E87349BD2F05C8B7\n'
              'PUBLIC_KEY_B64=XzCXEP9CcVrgJszvZgk6hsxItg0HCzFUCun7fbVGn0Y=\n'
              'ED25519_SIGNATURE=OK\n',encoding='utf-8')
          print('PARTS='+str(len(parts)))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skynetark-updates/update/v2
          git commit -m "SkynetARK: publish v10.5.1 stable v2"
          git push
