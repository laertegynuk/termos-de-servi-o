name: SkynetARK Publish v10.5.4
on:
  push:
    branches: [ main ]
    paths:
      - 'skynetark-updates/publish-trigger-v1039.txt'
permissions:
  contents: write
concurrency:
  group: skynetark-public-update-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout public update repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'

      - name: Install pinned crypto
        run: python -m pip install --disable-pip-version-check 'cryptography==45.0.6'

      - name: Download exact signed v10.5.4 artifact
        shell: bash
        run: |
          set -euo pipefail
          URL='https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-75e8-820e-bdb2-a058e96792bf/raw?se=2026-10-05T17%3A11%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=e3270da2-0ff0-5888-abda-9f53a5586c0b&skoid=127c13cb-e695-43ea-b6b2-0a863d41dbf7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T10%3A20%3A06Z&ske=2026-10-06T10%3A20%3A06Z&sks=b&skv=2026-02-06&sig=7KhVnh1WSFR/aDhOFiKHq2cHlar900flaWCkPtNH7FI%3D'
          curl --fail-with-body --silent --show-error --location "$URL" --output /tmp/artifact.zip
          mkdir -p /tmp/art
          unzip -q /tmp/artifact.zip -d /tmp/art
          cp /tmp/art/SkynetARK_v10.4.0_LocalUpdateBundle_LaerteGyn.zip /tmp/bundle.zip
          test "$(stat -c '%s' /tmp/bundle.zip)" = "3151599"
          test "$(sha256sum /tmp/bundle.zip | awk '{print toupper($1)}')" = "21E2CE4241ED6D5CD8A150BB9399C12F01AE53AD7B331D5D07B7DA5F71039703"

      - name: Verify signed release independently
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,io,json,zipfile
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
          raw=open('/tmp/bundle.zip','rb').read()
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None
              m=json.loads(z.read('manifest.json')); payload=z.read('payload.zip')
          assert m['product']=='SkynetARK' and m['version']=='10.5.4'
          psha=hashlib.sha256(payload).hexdigest()
          assert psha.upper()=='1D17D30B6480FBD1DA2B1CF1F7DC1785F012307B4E06C1D83181E72A5C19AF6E'
          assert psha.lower()==m['sha256'].lower()
          msg=f"SkynetARK\n10.5.4\n{psha.lower()}\npayload.zip".encode()
          Ed25519PublicKey.from_public_bytes(base64.b64decode('XzCXEP9CcVrgJszvZgk6hsxItg0HCzFUCun7fbVGn0Y=')).verify(base64.b64decode(m['signature']),msg)
          with zipfile.ZipFile(io.BytesIO(payload)) as pz:
              assert pz.read('SkynetARK/VERSION').decode('utf-8-sig').strip()=='10.5.4'
              assert hashlib.sha256(pz.read('SkynetARK/tools/SkynetARK_Update.exe')).hexdigest().upper()=='DC22C3A687A407AB9E906963F54D2DBEDC211BE2C1496629E87349BD2F05C8B7'
              broker=pz.read('SkynetARK/core/discord_command_broker.py').decode('utf-8-sig')
              assert 'def _clean_target_phrase' in broker
              assert 'def _map_key' in broker
              assert 'difflib.SequenceMatcher' in broker
          print('V1054_PUBLICATION_VERIFICATION=OK')
          PY

      - name: Prepare v2 public parts and manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,datetime
          raw=Path('/tmp/bundle.zip').read_bytes()
          out=Path('skynetark-updates/update/v2/stable/v10.5.4')
          out.mkdir(parents=True,exist_ok=True)
          for p in out.glob('part-*.b64'): p.unlink()
          parts=[]
          chunk_size=500000
          for i in range(0,len(raw),chunk_size):
              chunk=raw[i:i+chunk_size]
              name=f'part-{i//chunk_size:03d}.b64'
              (out/name).write_text(base64.b64encode(chunk).decode('ascii')+'\n',encoding='ascii')
              parts.append(f'https://raw.githubusercontent.com/laertegynuk/termos-de-servi-o/main/skynetark-updates/update/v2/stable/v10.5.4/{name}')
          (out/'SHA256SUMS.txt').write_text(
              'VERSION=10.5.4\n'
              'PAYLOAD_SHA256=1D17D30B6480FBD1DA2B1CF1F7DC1785F012307B4E06C1D83181E72A5C19AF6E\n'
              'BUNDLE_SHA256=21E2CE4241ED6D5CD8A150BB9399C12F01AE53AD7B331D5D07B7DA5F71039703\n'
              'UPDATER_SHA256=DC22C3A687A407AB9E906963F54D2DBEDC211BE2C1496629E87349BD2F05C8B7\n'
              'PUBLIC_KEY_B64=XzCXEP9CcVrgJszvZgk6hsxItg0HCzFUCun7fbVGn0Y=\n'
              'ED25519_SIGNATURE=OK\n',encoding='utf-8')
          manifest={
              'product':'SkynetARK','channel':'stable','latest_version':'10.5.4',
              'bundle_sha256':'21e2ce4241ed6d5cd8a150bb9399c12f01ae53ad7b331d5d07b7da5f71039703',
              'bundle_parts':parts,
              'release_url':'https://github.com/laertegynuk/Projetos-Pessoais/releases/tag/skynetark-v10.5.4',
              'notes':'SkynetARK v10.5.4 - corrige resolucao de mapas ASA no Discord, incluindo scorched earth ASA, nomes _WP e pequenos erros de digitacao.',
              'published_at':datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          }
          Path('/tmp/manifest-v1054.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('PARTS='+str(len(parts)))
          PY

      - name: Publish v10.5.4 files before manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skynetark-updates/update/v2/stable/v10.5.4
          git commit -m 'Publish SkynetARK v10.5.4 stable v2 files'
          git push origin main

      - name: Activate v10.5.4 v2 manifest last
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/manifest-v1054.json skynetark-updates/update/v2/manifest.json
          git add skynetark-updates/update/v2/manifest.json
          git commit -m 'Activate SkynetARK v10.5.4 stable v2'
          git push origin main
